method: VK-RCD-HAR-Baseline-Full
modality: [vk, depth, lidar, mmwave]
protocol: protocol3
split_to_use: random_split
init_rand_seed: 0

random_split:
  ratio: 0.8
  random_seed: 0

loader:
  batch_size: 16
  num_workers: 4

model:
  modalities: [vk, depth, lidar, mmwave]
  num_classes: 27
  dim: 512
  tokens_per_modality: 32
  graph_layers: 2
  fusion_layers: 2
  fusion_heads: 8
  fusion_mode: uncertainty
  freeze_pretrained_backbones: true
  backbone_root: backbones
  pretrained_paths:
    depth: backbones/depth_benchmark/depth_Resnet18.pt
    lidar: backbones/lidar_benchmark/lidar_all_random.pt
    mmwave: backbones/mmwave_benchmark/mmwave_all_random_TD.pt

loss:
  lambda_unc: 0.0
  tau: 1.0

training_epochs: 50
learning_rate: 0.0001
eval_every: 5
save_every: 5
grad_clip: 1.0
output_dir: outputs/baseline_full

