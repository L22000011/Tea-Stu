method: VK-RCD-HAR-Baseline-CrossSubject
modality: [vk, depth, lidar, mmwave]
protocol: protocol3
split_to_use: cross_subject_split
init_rand_seed: 0

random_split:
  ratio: 0.8
  random_seed: 0
cross_scene_split:
  train_dataset:
    scenes: [E01, E02, E03]
  val_dataset:
    scenes: [E04]

cross_subject_split:
  train_dataset:
    subjects: [S01, S02, S03, S04, S06, S07, S08, S09, S11, S12, S13, S14, S16, S17, S18, S19, S21, S22, S23, S24, S26, S27, S28, S29, S31, S32, S33, S34, S36, S37, S38, S39]
  val_dataset:
    subjects: [S05, S10, S15, S20, S25, S30, S35, S40]

loader:
  batch_size: 16
  num_workers: 4

model:
  modalities: [vk, depth, lidar, mmwave]
  num_classes: 27
  dim: 512
  tokens_per_modality: 32
  graph_layers: 2
  fusion_layers: 2
  fusion_heads: 8
  fusion_mode: uncertainty
  freeze_pretrained_backbones: true
  backbone_root: backbones
  pretrained_paths:
    depth: backbones/depth_benchmark/depth_Resnet18.pt
    lidar: backbones/lidar_benchmark/lidar_all_random.pt
    mmwave: backbones/mmwave_benchmark/mmwave_all_random_TD.pt

loss:
  lambda_unc: 0.0
  tau: 1.0

training_epochs: 50
learning_rate: 0.0001
eval_every: 5
save_every: 5
grad_clip: 1.0
output_dir: outputs/baseline_cross_subject



