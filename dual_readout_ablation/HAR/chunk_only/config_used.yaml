loader:
  batch_size: 16
  num_workers: 4
model:
  modalities:
  - vk
  - depth
  - lidar
  - mmwave
  num_classes: 27
  dim: 512
  tokens_per_modality: 32
  graph_layers: 2
  fusion_layers: 2
  fusion_heads: 8
  fusion_mode: uncertainty
  freeze_pretrained_backbones: true
  backbone_root: /apps/users/icps_intelligence/data/lyg/X-Fi/MMFi_HAR/backbones
  pretrained_paths:
    depth: /apps/users/icps_intelligence/data/lyg/X-Fi/MMFi_HAR/backbones/depth_benchmark/depth_Resnet18.pt
    lidar: /apps/users/icps_intelligence/data/lyg/X-Fi/MMFi_HAR/backbones/lidar_benchmark/lidar_all_random.pt
    mmwave: /apps/users/icps_intelligence/data/lyg/X-Fi/MMFi_HAR/backbones/mmwave_benchmark/mmwave_all_random_TD.pt
loss:
  lambda_kd: 0.7
  lambda_token: 0.1
  lambda_rel: 0.03
  lambda_unc: 0.05
  temperature: 4.0
  tau: 1.0
student_modalities:
- vk
- depth
- lidar
- mmwave
teacher_modalities:
- vk
- depth
- lidar
- mmwave
drop_counts:
- 1
- 2
- 3
eval_modalities:
- vk
- depth
- lidar
- mmwave
training_epochs: 10
learning_rate: 0.0001
eval_every: 5
save_every: 5
grad_clip: 1.0
